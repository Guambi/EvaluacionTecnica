name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build y Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
          checks: write # Essential for dorny/test-reporter
          contents: read # Often needed for checking out code
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: |
        dotnet test EnrollmentService/UnitTests/EnrollmentService.UnitTests/EnrollmentService.UnitTests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --collect:"XPlat Code Coverage"

    - name: Run Auth Service Tests
      run: |
        dotnet test AuthService/Tests/AuthService.UnitTests/AuthService.UnitTests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=auth-test-results.trx"

    - name: Run Payment Service Tests
      run: |
        dotnet test PaymentWebhookService/Tests/PaymentWebhookService.UnitTests/PaymentWebhookService.UnitTests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=payment-test-results.trx"

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/*.trx'
        reporter: dotnet-trx

    - name: Code Coverage Report
      uses: codecov/codecov-action@v3
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true

  # Job 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run Security Scan - Dependencies
      run: dotnet list package --vulnerable --include-transitive

    - name: Run .NET Security Scan
      run: |
        dotnet tool install --global security-scan
        security-scan *.sln --excl-proj=**/*Tests.csproj || true

  # Job 3: Docker Build
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    
    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: ApiGateway/Dockerfile
          - name: auth-service
            dockerfile: AuthService/Application/Dockerfile
          - name: enrollment-service
            dockerfile: EnrollmentService/Application/Dockerfile
          - name: payment-webhook-service
            dockerfile: PaymentWebhookService/Application/Dockerfile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image - ${{ matrix.service.name }}
      run: |
        docker build -t ${{ matrix.service.name }}:latest \
          -f ${{ matrix.service.dockerfile }} \
          .

    - name: Run Trivy vulnerability scanner - ${{ matrix.service.name }}
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ matrix.service.name }}:latest'
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service.name }}.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.service.name }}.sarif'